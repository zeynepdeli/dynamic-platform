# Production: tek sunucuda tüm sistem + otomatik HTTPS.
#
#   cp .env.prod.example .env.prod   # değerleri doldurun (commit ETMEYİN)
#   docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
#   docker compose -f compose.prod.yaml --env-file .env.prod run --rm api node_modules/.bin/tsx prisma/seed.ts          # isteğe bağlı örnek içerik
#   docker compose -f compose.prod.yaml --env-file .env.prod run --rm api node_modules/.bin/tsx scripts/create-admin.ts
#
# Ayrıntılar: kökteki README.md → "Yayına alma"

name: ${COMPOSE_PROJECT_NAME:-dynamic-platform}

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET zorunlu}
  FRONTEND_URL: https://${ADMIN_DOMAIN}
  TRUST_PROXY_HOPS: "1"
  WEB_API_SECRET: ${WEB_API_SECRET:?WEB_API_SECRET zorunlu}
  MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-dynamic-platform}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  SEED_SITE_NAME: ${SEED_SITE_NAME:-}
  COMMERCE_ENABLED: ${COMMERCE_ENABLED:-false}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER zorunlu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB zorunlu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    # Dışarıya port AÇILMAZ; yalnızca iç ağdan erişilir.

  # Her açılışta bekleyen migration'ları uygular, sonra kapanır.
  migrate:
    build: { context: .., target: api }
    image: ${COMPOSE_PROJECT_NAME:-dynamic-platform}-api
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: .., target: api }
    image: ${COMPOSE_PROJECT_NAME:-dynamic-platform}-api
    restart: unless-stopped
    environment: *api-env
    volumes:
      # MEDIA_STORAGE=local ise yüklenen görseller burada kalıcı tutulur
      - media:/app/storage/media
    depends_on:
      migrate: { condition: service_completed_successfully }

  admin:
    build: { context: .., target: admin }
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
      API_PUBLIC_URL: https://${API_DOMAIN}
      WEB_API_SECRET: ${WEB_API_SECRET}
    depends_on: [api]

  web:
    build: { context: .., target: web }
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
      API_PUBLIC_URL: https://${API_DOMAIN}
      SITE_URL: https://${SITE_DOMAIN}
      WEB_API_SECRET: ${WEB_API_SECRET}
      REVALIDATE_SECONDS: ${REVALIDATE_SECONDS:-30}
    depends_on: [api]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN zorunlu}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN zorunlu}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN zorunlu}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL zorunlu}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, admin, api]

volumes:
  postgres_data:
  media:
  caddy_data:
  caddy_config:
